<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="bootstrap5.css" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <h2>REGISTRATION FORM</h2>
        <div class="row">
            <div class="col-md-6 col-sm-6">
                <label class="form-label">Enter FirstName</label>
                <input type="text" id="txtFName" class="form-control" placeholder="Enter First Name"/>
            </div>
            <div class="col-md-6 col-sm-6">
                <label>Enter SecondName</label>
                <input type="text" id="txtSName" class="form-control" placeholder="Enter Second Name"/>
            </div>
            <div class="col-md-6 col-sm-6">
                <label>Enter MobileNo</label>
                <input type="text" id="txtNo" class="form-control" placeholder="Enter Mobile Number"/>
            </div>
            <div class="col-md-6 col-sm-6">
                <label>Enter EmailID</label>
                <input type="text id=txtEmail" class="form-control" placeholder="Enter EmailID"/>
            </div>
            <div class="col-md-6 col-sm-6">
                <label>Enter Address</label>
                <input type="text id=txtAddress" class="form-control" placeholder="Enter Address"/>
            </div>
            <div class="text-end mt-4">
                <input type="button" class="btn btn-success btn-lg"/>
            </div>
    </div>
</body>
</html>
